<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teja RAG Chatbot — Ask about Teja's work</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  header { background: #ffffff; border-bottom: 3px solid #2563eb; padding: 22px 20px; }
  header h1 { margin: 0; font-size: 1.5rem; color: #1e40af; }
  header h1 span { color: #2563eb; }
  header p { margin: 6px 0 0; color: #475569; font-size: .92rem; }
  main { max-width: 780px; margin: 0 auto; padding: 20px; }
  #status { font-size: .85rem; color: #64748b; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .upload { background: #ffffff; border: 2px dashed #93c5fd; border-radius: 14px; padding: 16px; margin-bottom: 18px; font-size: .9rem; color: #334155; }
  .upload strong { color: #1e40af; }
  .upload input { margin-top: 8px; }
  #uploadMsg { color: #15803d; font-weight: 600; }
  #chat { display: flex; flex-direction: column; gap: 12px; min-height: 260px; }
  .msg { padding: 13px 16px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .user { background: #2563eb; color: #fff; align-self: flex-end; max-width: 85%; border-bottom-right-radius: 4px; }
  .bot { background: #ffffff; border: 1px solid #e2e8f0; align-self: flex-start; max-width: 95%; border-bottom-left-radius: 4px; }
  .sources { margin-top: 10px; font-size: .82rem; color: #1e40af; }
  .sources details { margin-top: 6px; }
  .sources summary { cursor: pointer; font-weight: 600; }
  .sources p { color: #334155; background: #eff6ff; border-left: 3px solid #2563eb; padding: 9px 10px; border-radius: 0 8px 8px 0; }
  form { display: flex; gap: 8px; margin-top: 16px; position: sticky; bottom: 12px; background: #f8fafc; padding: 4px 0; }
  input[type=text] { flex: 1; padding: 13px; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; font-size: 1rem; }
  input[type=text]:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  button { padding: 13px 22px; border-radius: 999px; border: none; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { background: #fff; border: 1px solid #bfdbfe; color: #1e40af; padding: 7px 12px; border-radius: 999px; font-size: .82rem; cursor: pointer; }
  .chip:hover { background: #eff6ff; }
</style>
</head>
<body>
<header>
  <h1>Krishnateja <span>RAG Doc Chatbot</span></h1>
  <p>Ask about Teja's PhD, Technobot, or Elite Tech work — every answer cites its source document.</p>
</header>
<main>
  <div id="status">Loading…</div>
  <div class="upload">
    <label><strong>Upload a document (.txt / .md)</strong> — it will be chunked and indexed, then you can ask about it.</label><br>
    <input type="file" id="file" accept=".txt,.md">
    <span id="uploadMsg"></span>
  </div>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input type="text" id="q" placeholder="Ask a question, e.g. What AI work did Teja do at Technobot?" autocomplete="off">
    <button id="send" type="submit">Ask</button>
  </form>
</main>
<script>
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');
const SAMPLE_QUESTIONS = [
  "Where does Teja study for his PhD?",
  "What AI work did Teja do at Technobot?",
  "What did Teja build at Elite Tech Info?",
  "What programming languages does Teja use?",
  "How many years of experience does Teja have?"
];
SAMPLE_QUESTIONS.forEach(q => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = q;
  b.onclick = () => { document.getElementById('q').value = q; ask(q); };
  document.getElementById('chips').appendChild(b);
});

async function loadStatus() {
  try {
    const r = await fetch('/health');
    const h = await r.json();
    statusEl.textContent = `Mode: ${h.mode} (${h.mode === 'mock' ? 'demo — no API key needed' : 'live LLM'}) · Vector store: ${h.vector_store} · ${h.chunks_indexed} chunks indexed · Docs: ${h.docs.join(', ')}`;
  } catch (e) { statusEl.textContent = 'Backend not reachable — is it running on port 8000?'; }
}
loadStatus();

function addMsg(text, cls, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.innerHTML = '<strong>Sources:</strong> ' + sources.map(x => x.source).join(', ');
    sources.forEach(x => {
      const d = document.createElement('details');
      d.innerHTML = `<summary>${x.source}</summary><p>${x.text}</p>`;
      s.appendChild(d);
    });
    div.appendChild(s);
  }
  chat.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

async function ask(question) {
  if (!question.trim()) return;
  addMsg(question, 'user');
  document.getElementById('send').disabled = true;
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await r.json();
    addMsg(data.answer + `\n\n(mode: ${data.mode} / ${data.model})`, 'bot', data.sources);
  } catch (e) {
    addMsg('Error: could not reach the backend. Is it running?', 'bot');
  }
  document.getElementById('send').disabled = false;
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q');
  ask(q.value); q.value = '';
});

document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/upload', { method: 'POST', body: fd });
  const data = await r.json();
  document.getElementById('uploadMsg').textContent =
    r.ok ? ` Indexed ${data.filename}: ${data.chunks_added} chunks added.` : ` Error: ${data.detail || 'upload failed'}`;
  loadStatus();
});
</script>
</body>
</html>
